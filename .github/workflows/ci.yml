name: Android CI Build & Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Runs tests & assembles APK in one pass
      - name: Run Tests & Build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --build-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: clarity-finance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Upload Test Reports (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 3
