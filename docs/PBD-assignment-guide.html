'<h3>Functional Requirements</h3>'+T(['ID','අවශ්‍යතාව','scenario මූලය'],[['FR1','Email/password Register & Login (Firebase Auth); Google Sign-In <span class="tag">bonus</span>; logout','Assignment §5'],['FR2','ආදායම් ප්‍රභව 4ක් (Salary, Freelance, AdSense, Crypto) record කිරීම','§3.2'],['FR3','Multi-currency ආදායම: LKR / USD / USDT, exchange rate සහ LKR අගය stored','AdSense USD, crypto'],['FR4','Freelance invoices: pending / paid status, due date, project note, overdue highlight, "Mark paid"','invoice 2ක් අමතක වීම'],['FR5','Crypto gain/loss entries සහ YTD net position','Q1 gain / Q3 loss'],['FR6','Salary variable amount (bonus සමඟ) සෑම මාසයකම වෙනම record','120k–140k'],['FR7','Quick expense entry (amount, category, type, payment channel, date, note)','friction'],['FR8','Payment channels: Card, Cash, Secondary account','§3.3'],['FR9','Category system + Committed vs Discretionary tagging','"no category system"'],['FR10','Recurring expenses (rent 34,000, gym, subscriptions) auto-log','gym + subscriptions'],['FR11','Dashboard: actual monthly income, spent, savings, goal status – real-time listener','§5 Database'],['FR12','Visual summaries: donut, category bars, payment channel breakdown, top leak','never seen visual'],['FR13','Savings Goal: target, deadline, saved amount, required monthly saving, progress, projection','MacBook 490,000'],['FR14','Goal contributions: deposit / withdraw / history','savings 11,200'],['FR15','Edit & delete expense/income/contribution','data corrections'],['FR16','Month navigation (history & comparison)','3-month review'],['FR17','Exchange-rate settings (USD, USDT)','AdSense rate'],['FR18','Insights nudges: discretionary % , "20% cut" impact, subscription cost','coffee LKR 24,000']])+
'<h3>Non-Functional Requirements</h3>'+L(['<b>Usability:</b> expense entry ≤ 5 seconds / ≤ 3 taps; minimal, calm UI; no mandatory daily streaks (guilt නැති)','<b>Offline-first:</b> Room cache + Firestore offline persistence; network නැතිවිටත් UI block නොවේ','<b>Reliability:</b> no unhandled exceptions, no blank screen on network failure, no crash on empty dataset','<b>Security:</b> user data per-uid isolation (Firestore Security Rules), no hard-coded data','<b>Performance:</b> real-time listener scoped to current month; indexes for queries','<b>Compatibility:</b> API 26+, target 34+','<b>Maintainability:</b> strict MVVM, Hilt DI, repository abstraction, unit-testable ViewModels','<b>Accuracy:</b> money as Long/BigDecimal (Double නොවේ), rate snapshot per entry','<b>Accessibility/Design:</b> Material 3, contrast, touch targets 48dp'])+
'<h3>Constraints</h3>'+L(['Kotlin 100% (Java නැත), Gradle Kotlin DSL','Jetpack Compose only – XML layouts නැත','Single-activity + Navigation Compose','Bank data auto-import <b>නොහැක</b> (manual entry පමණි)','Live Firebase project (local emulator submission වලට නොයෙදේ)','Group ≤ 3, deadline 30/10/2026','AI-generated code undisclosed submit කිරීම තහනම්'])],

['phases','6. ඔබ නිෂ්පාදනය කළ යුතු දේ (Phase 2 & 3)',

'<h3>Phase 3 – Implementation (කිසිදු ව්‍යතිරේකයකින් තොරව)</h3>'+L(['Kotlin පමණි; Java interop නැත','සියලුම UI Jetpack Compose; XML නැත','MVVM දැඩි ලෙස: ViewModel logic Composable තුළ නොතිබිය යුතුයි; UI layer එකෙන් data layer call නොකළ යුතුයි','Firebase Authentication user identity කළමනාකරණය කළ යුතුයි – <b>hard-coded user data = Firebase criterion එකට 0</b>','Firestore = primary persistence; <b>Security Rules submit කළ යුතුයි</b>','API 26+ හි install වී run විය යුතුයි, target 34+','සියලු basic error states: unhandled exception නැත, network failure හිදී blank screen නැත, empty dataset හිදී crash නැත'])],

['stack','7. Tech Stack',
T(['Layer','අනිවාර්ය තාක්ෂණය','සටහන්'],[['Language','Kotlin (100%)','Java files නැත; Gradle Kotlin DSL'],['UI','Jetpack Compose','Material Design 3; XML නැත'],['Navigation','Navigation Compose','Single-activity; typed arguments වඩාත් සුදුසුයි'],['Architecture','MVVM','UI → ViewModel → Repository → Model'],['State','StateFlow / LiveData','ViewModel එකෙන් raw mutable state UI එකට නොදිය යුතුයි (private MutableStateFlow + public StateFlow)'],['Async','Kotlin Coroutines','සියලු async වලට <code>viewModelScope</code>'],['Auth','Firebase Authentication','Email/password <b>අනිවාර්ය</b>; Google Sign-In = bonus'],['Database','Firebase Firestore','Dashboard හි real-time listeners; Security rules අවශ්‍යයි'],['Local cache','Room <span class="tag">ඉතා නිර්දේශිත</span>','Offline persistence; network නැතිවිට UI block නොකරන්න'],['DI','Hilt (preferred) / Koin','Composable තුළ ViewModel manually instantiate නොකරන්න (<code>hiltViewModel()</code>)'],['SDK','minSdk 26 (Oreo)','targetSdk 34+']])+
C(`// build.gradle.kts (app) – ප්‍රධාන dependencies\nplugins { id("com.android.application"); kotlin("android"); id("com.google.gms.google-services"); id("com.google.dagger.hilt.android"); id("com.google.devtools.ksp") }\nandroid { defaultConfig { minSdk = 26; targetSdk = 34 }  buildFeatures { compose = true } }\ndependencies {\n  implementation(platform("androidx.compose:compose-bom:<ver>")); implementation("androidx.compose.material3:material3")\n  implementation("androidx.navigation:navigation-compose:<ver>")\n  implementation("androidx.hilt:hilt-navigation-compose:<ver>"); implementation("com.google.dagger:hilt-android:<ver>")\n  implementation(platform("com.google.firebase:firebase-bom:<ver>")); implementation("com.google.firebase:firebase-auth-ktx"); implementation("com.google.firebase:firebase-firestore-ktx")\n  implementation("androidx.room:room-runtime:<ver>"); implementation("androidx.room:room-ktx:<ver>"); ksp("androidx.room:room-compiler:<ver>")\n  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:<ver>")  // Task.await()\n}`)],

['arch','8. MVVM Architecture',
C(`com.clarity.finance/\n ├─ ui/ (Composables only – logic නැත)\n │   ├─ auth/       LoginScreen, RegisterScreen\n │   ├─ dashboard/  DashboardScreen\n │   ├─ income/     IncomeScreen, AddIncomeSheet\n │   ├─ expense/    AddExpenseSheet, ExpenseListScreen\n │   ├─ insights/   InsightsScreen (donut, bars)\n │   ├─ goal/       GoalScreen\n │   ├─ settings/   SettingsScreen (rates, recurring)\n │   ├─ navigation/ NavGraph (sealed Routes)\n │   └─ theme/      Material3 Color/Type/Theme\n ├─ viewmodel/  AuthVM, DashboardVM, IncomeVM, ExpenseVM, InsightsVM, GoalVM, SettingsVM\n ├─ data/\n │   ├─ repository/ AuthRepo, IncomeRepo, ExpenseRepo, GoalRepo, SettingsRepo (interfaces + impl)\n │   ├─ remote/     Firestore data sources (snapshot listeners → callbackFlow)\n │   └─ local/      Room: Database, DAOs, Entities\n ├─ model/      Income, Expense, Goal, RecurringExpense, enums\n ├─ di/         AppModule (Hilt)\n └─ util/       MoneyUtils, DateUtils, Result/UiState`)+
T(['Layer','වගකීම','නීති'],[['Screen (Composable)','UI පෙන්වීම; events ViewModel වෙත යැවීම','<code>collectAsStateWithLifecycle()</code>; business logic නැත'],['ViewModel','UI state (<code>StateFlow&lt;UiState&gt;</code>) හදා ගැනීම; ගණනය (totals, ratios, goal projection)','Repository පමණක් call කරයි; <code>viewModelScope.launch</code>'],['Repository','Single source of truth: Firestore ↔ Room','Flow ආපසු දෙයි; UI වෙතින් කෙලින්ම Firestore නොයෙදේ'],['Data source','FirebaseFirestore / Room DAO','callbackFlow + addSnapshotListener']])+
P('<b>Data flow:</b> Screen → ViewModel (event) → Repository → Firestore (write) → snapshot listener → Repository Flow → ViewModel StateFlow (aggregate) → Screen recompose. Offline: Room cache + <code>FirebaseFirestoreSettings.isPersistenceEnabled</code>.')+
C(`sealed interface UiState<out T>{ object Loading; data class Success<T>(val data:T); data class Error(val msg:String); object Empty }\nclass DashboardViewModel @Inject constructor(private val repo: ExpenseRepository): ViewModel(){\n  private val _state = MutableStateFlow<UiState<Summary>>(UiState.Loading)\n  val state: StateFlow<UiState<Summary>> = _state.asStateFlow()\n  init { viewModelScope.launch { repo.observeMonth(ym).catch{ _state.value = UiState.Error(it.message?:"") }.collect{ _state.value = if(it.isEmpty()) UiState.Empty else UiState.Success(it.toSummary()) } } }\n}`)],

['schema','9. Firestore Schema, Indexing & Multi-Currency',
C(`users/{uid}                         // profile\n  name, email, baseCurrency:"LKR", createdAt\n  rates: { USD: 305.0, USDT: 305.0 }   // default rates (user editable)\n  ├─ incomes/{incomeId}\n  │    source: "SALARY|FREELANCE|ADSENSE|CRYPTO"\n  │    amount: 42.0            // original amount (crypto loss = negative)\n  │    currency: "USD"         // LKR | USD | USDT\n  │    exchangeRate: 305.0     // rate snapshot AT transfer\n  │    amountLKR: 12810        // stored (amount × rate) → fast aggregation\n  │    status: "RECEIVED|PENDING"   // freelance invoices\n  │    date: Timestamp         // received / due date\n  │    month: "2026-10"        // denormalised for queries\n  │    projectName, note, createdAt\n  ├─ expenses/{expenseId}\n  │    amount(LKR), category, type:"COMMITTED|DISCRETIONARY"\n  │    paymentMethod:"CARD|CASH|SECONDARY", date, month, note, recurringId?, createdAt\n  ├─ recurring/{recId}        // rent, gym, subscriptions\n  │    category, amount, dayOfMonth, type, paymentMethod, active, lastApplied:"2026-10"\n  ├─ goals/{goalId}\n  │    name:"MacBook Pro M4", targetAmount:490000, startingAmount:11200, deadline, status\n  └─ savings/{entryId}        // goal contributions\n       goalId, amount (+deposit / −withdraw), date, month, note`)+
T(['තීරණය','Justification (Kavindu ගේ scenario අනුව)'],[['Sub-collections under <code>users/{uid}</code>','Security rules සරලයි (uid isolation); user එකකට query scope කුඩා; collection-group query අවශ්‍ය නැත'],['<code>amountLKR</code> + <code>exchangeRate</code> snapshot','AdSense USD වල rate එක මාරු කළ දිනයේ rate එකයි; පසුව rate වෙනස් වුවත් ඉතිහාසය නොවෙනස්. Dashboard sum = server-side aggregation නොමැතිව ඉක්මන්'],['<code>month</code> field denormalised','"මාසික" views සඳහා <code>whereEqualTo("month", ym)</code> – range queries වලට වඩා සරල'],['Income vs Expense වෙනම collections','data model පටු නොවේ; ආදායම් ප්‍රභව ගණනාවක් සහ වියදම් වෙනස් fields ඇත'],['<code>status</code> (PENDING/RECEIVED)','Pending invoices ආදායමට ඇතුළත් නොවේ; overdue = PENDING + date &lt; today'],['Crypto negative amount','Loss = negative; YTD net = sum(amountLKR) where source=CRYPTO & year'],['Savings වෙනම collection','Goal saved = startingAmount + Σ savings; audit trail + undo/delete']])+
'<h3>Indexes</h3>'+T(['Query','Index'],[['මාසයේ වියදම් (නව→පැරණි)','expenses: <code>month ASC, date DESC</code> (composite)'],['මාසයේ ආදායම්','incomes: <code>month ASC, date DESC</code>'],['Pending invoices','incomes: <code>status ASC, date ASC</code>'],['Category/type filter','expenses: <code>month ASC, type ASC, date DESC</code>'],['Crypto YTD','incomes: <code>source ASC, date ASC</code>'],['Savings history','savings: <code>goalId ASC, date DESC</code>']])+
'<h3>firestore.rules (අනිවාර්ය deliverable)</h3>'+C(`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function signedIn(){ return request.auth != null; }\n    function owner(uid){ return signedIn() && request.auth.uid == uid; }\n    match /users/{uid} {\n      allow read, write: if owner(uid);\n      match /incomes/{id}  { allow read, delete: if owner(uid);\n        allow create, update: if owner(uid) && request.resource.data.amount is number\n          && request.resource.data.currency in ['LKR','USD','USDT']\n          && request.resource.data.source in ['SALARY','FREELANCE','ADSENSE','CRYPTO']; }\n      match /expenses/{id} { allow read, delete: if owner(uid);\n        allow create, update: if owner(uid) && request.resource.data.amount is number\n          && request.resource.data.amount > 0\n          && request.resource.data.type in ['COMMITTED','DISCRETIONARY']; }\n      match /{sub=**} { allow read, write: if owner(uid); }   // recurring, goals, savings\n    }\n  }\n}`)],
